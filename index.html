<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر المذاكرة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column ledger, sticky header with tabs; each tab is a stack of plain cards. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E8EDF2; --line:#D3DCE4;
  --fg:#13202B; --muted:#566878;
  --accent:#3B5BDB; --accent-fg:#FFFFFF; --accent-soft:#E2E8FC;
  --ok:#17795A; --ok-soft:#DAF1E6; --warn:#955600; --warn-soft:#FAEACB; --bad:#B42318;
  --f-display:'Cairo','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1620; --surface:#14212C; --surface-2:#1B2A37; --line:#2A3B49;
    --fg:#E6EDF3; --muted:#93A6B6;
    --accent:#8FA4FF; --accent-fg:#0D1620; --accent-soft:#222F58;
    --ok:#52C79A; --ok-soft:#163A2D; --warn:#F0B35A; --warn-soft:#3D2D10; --bad:#FF8A7A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1620; --surface:#14212C; --surface-2:#1B2A37; --line:#2A3B49;
  --fg:#E6EDF3; --muted:#93A6B6;
  --accent:#8FA4FF; --accent-fg:#0D1620; --accent-soft:#222F58;
  --ok:#52C79A; --ok-soft:#163A2D; --warn:#F0B35A; --warn-soft:#3D2D10; --bad:#FF8A7A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--f-body); font-size:16px; line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:880px;margin-inline:auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 0;border-bottom:1px solid var(--line)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
.sub{margin:0;color:var(--muted);font-size:.9rem}
#tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
#tabs a{padding:8px 14px;border-bottom:3px solid transparent;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
#tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
#tabs a:hover{color:var(--fg)}
main{padding-block:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lbl{font-size:.9rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=email],input[type=password],textarea,select{
  width:100%;font:inherit;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
input[type=number]{font-family:var(--f-num);max-width:9rem}
textarea{min-height:76px;resize:vertical}
input:disabled,textarea:disabled,select:disabled{opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.row input[type=text]{flex:1 1 12rem}
.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg)}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:.85rem;font-weight:500}
.lnk{background:none;border:0;font:inherit;font-weight:600;color:var(--fg);cursor:pointer;padding:0;text-align:start;overflow-wrap:anywhere}
.lnk:hover{text-decoration:underline}
a{color:var(--accent)}
.chip{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.note{margin:0 0 16px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.92rem}
.note.bad{color:var(--bad)}
.empty{margin:0;padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.flat{margin:0}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .k{font-size:.82rem;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--f-num);font-size:1.4rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.3;overflow-wrap:anywhere}
.stat .s{font-size:.82rem;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.daynav h2{flex:1 1 auto}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tasks li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;min-width:0}
.tasks li span{min-width:0;overflow-wrap:anywhere}
.tasks label{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;overflow-wrap:anywhere;flex:1}
.tasks input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.tasks .done{color:var(--muted);text-decoration:line-through}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.92rem}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin-top:4px}
.result{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:.9rem;padding:6px 14px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.rk-list{list-style:none;margin:0;padding:0}
.rk{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk .n{font-family:var(--f-num);font-size:1.15rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rk.top3 .n{color:var(--accent);font-weight:500}
.who{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.rk .h{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:end}
.rk .meta{grid-column:2 / 4;font-size:.82rem;color:var(--muted)}
.rk .bar{grid-column:2 / 4}
.rk.me{background:var(--accent-soft);border-radius:8px;padding-inline:10px}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:.9rem;background:var(--surface-2)}
.av.lg{width:56px;height:56px;font-size:1.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mc p{margin:0;font-size:.9rem;overflow-wrap:anywhere}
.mc ul{margin:0;padding-inline-start:18px;font-size:.88rem}
.mc li.done{color:var(--muted);text-decoration:line-through}
.mc .foot{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.st{font:inherit;font-size:.8rem;font-weight:600;border-radius:99px;border:1px solid var(--line);padding:2px 10px;cursor:pointer;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.st.s1{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st.s2{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.sp{font-size:.8rem;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-family:var(--f-num)}
.sp.s1{background:var(--warn-soft);color:var(--warn)}
.sp.s2{background:var(--ok-soft);color:var(--ok)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;align-items:center;gap:10px;min-width:0}
.steps li span.t{flex:1;min-width:0;overflow-wrap:anywhere}
details.rm{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
details.rm summary{cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;list-style:none}
details.rm summary::-webkit-details-marker{display:none}
details.rm .steps,details.rm .bar{margin-top:12px}
.strip{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.now{outline:2px solid var(--fg);outline-offset:1px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--bg);min-width:0}
.badge.on{background:var(--accent-soft);border-color:var(--accent)}
.badge.off{opacity:.55}
.badge b{font-size:.92rem}
.badge span{font-size:.78rem;color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:760px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap;font-size:.9rem;vertical-align:top}
.tbl th{color:var(--muted);font-weight:500}
.tbl td .sm2{display:block;font-size:.78rem;color:var(--muted)}
#toast{position:fixed;z-index:20;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
#toast span{background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:500;max-width:100%}
#toast span.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}

:root{color-scheme:light}
body{margin:0}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fm{display:flex;flex-direction:column;gap:12px}
.auth{max-width:440px;margin-inline:auto;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="hdr"><h1>دفتر المذاكرة</h1><div id="hdr-actions"></div></div>
    <p class="sub" id="today-label"></p>
    <nav id="tabs" aria-label="أقسام الموقع"></nav>
  </header>
  <main id="view" tabindex="-1"><p class="empty">بحمّل...</p></main>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<noscript><p style="padding:16px">الموقع محتاج JavaScript علشان يشتغل.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
const LI_URL=(window.APP_CONFIG&&window.APP_CONFIG.OWNER_LINKEDIN)||'https://www.linkedin.com/in/saeidbary999/';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,attrs){
  const el=document.createElement(tag);
  if(attrs){
    for(const k of Object.keys(attrs)){
      const v=attrs[k];
      if(v==null||v===false) continue;
      if(k==='class') el.className=v;
      else if(k==='text') el.textContent=v;
      else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2),v);
      else if(k==='value') el.value=v;
      else if(k==='checked') el.checked=true;
      else if(k==='disabled') el.disabled=true;
      else el.setAttribute(k,v===true?'':String(v));
    }
  }
  for(let i=2;i<arguments.length;i++){
    const kids=[].concat(arguments[i]);
    for(const kid of kids){
      if(kid==null||kid===false) continue;
      el.append(kid.nodeType?kid:document.createTextNode(String(kid)));
    }
  }
  return el;
}
const pad=n=>String(n).padStart(2,'0');
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayKey(){return keyOf(new Date());}
function addDays(key,n){const p=key.split('-').map(Number);return keyOf(new Date(p[0],p[1]-1,p[2]+n));}
function weekStartOf(key){const p=key.split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);return addDays(key,-((d.getDay()+1)%7));}
function weekStartKey(){return weekStartOf(todayKey());}
function monthStartKey(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-01';}
let dateFmt;
try{dateFmt=new Intl.DateTimeFormat('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});}catch(e){dateFmt=null;}
function longDate(key){const p=key.split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);return dateFmt?dateFmt.format(d):key;}
function fmtH(v){return String(+Number(v).toFixed(1));}
function toNum(v,min,max){
  if(v===''||v==null) return null;
  const n=Number(v); if(!isFinite(n)) return null;
  return Math.min(max,Math.max(min,Math.round(n*2)/2));
}
function bar(pct){const i=h('i');i.style.width=Math.max(0,Math.min(100,pct))+'%';return h('div',{class:'bar'},i);}
let toastTimer=null;
function toast(msg,bad){
  const t=$('#toast'); t.replaceChildren(h('span',{class:bad?'bad':'',text:msg}));
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.replaceChildren(),4500);
}
function safeLi(u){return typeof u==='string'&&/^https:\/\/([a-z0-9-]+\.)?linkedin\.com\/in\/[^\s]+$/i.test(u)?u:'';}
function normLi(v){
  v=String(v||'').trim();
  if(!v) return '';
  if(!/^https?:\/\//i.test(v)){
    if(/^[\w\-.%]{3,100}$/.test(v)) v='https://www.linkedin.com/in/'+v+'/'; else return null;
  }
  v=v.replace(/^http:/i,'https:').split('?')[0].split('#')[0];
  return safeLi(v)?v:null;
}

/* ---------- rules: achievement points ---------- */
/* [id, label, base points, bonus XP] */
const TYPES=[
  ['none','ماعملتش حاجة محددة النهارده',0,0],
  ['watch','شفت فيديوهات أو قرأت بس',1,0],
  ['notes','كتبت ملخص أو نوتس',2,0],
  ['practice','حليت تمارين أو كويز',3,0],
  ['module','خلّصت موديول أو كورس',4,30],
  ['lab','طبّقت Lab بخطوات جاهزة',4,5],
  ['build','بنيت أو ضبطت حاجة شغالة من نفسي',6,10],
  ['fix','حلّيت مشكلة حقيقية (debug)',6,10],
  ['ship','نشرت شغلي: ريبو أو سيرفس شغال أو مقال أو فيديو',8,30]
];
const DIFF=[['easy','سهل',0],['mid','متوسط',1],['hard','صعب',2]];
function scoreOf(day){
  const a=day&&day.ach;
  if(!a||typeof a.type!=='string') return null;
  const t=TYPES.find(x=>x[0]===a.type);
  if(!t) return null;
  if(t[2]>0&&String(day.did||'').trim().length<25) return {score:0,parts:[['وصف الإنجاز قصير جداً',0]]};
  let sc=t[2];const parts=[['الأساس: '+t[1],t[2]]];
  if(t[2]>=3){
    const l=DIFF.find(x=>x[0]===a.level)||DIFF[0];
    if(l[2]){sc+=l[2];parts.push(['صعوبة '+l[1],l[2]]);}
  }
  if(t[2]>0&&/^https?:\/\/\S+$/i.test(String(day.proof||''))){sc+=1;parts.push(['لينك دليل',1]);}
  if(t[2]>0&&a.shared){sc+=1;parts.push(['شاركته مع الجروب',1]);}
  return {score:Math.min(10,sc),parts:parts};
}
function partsText(r){return r.parts.map(p=>p[0]+(p[1]?' +'+p[1]:'')).join(' · ');}
function dayPts(d){
  if(!d||!d.closed) return null;
  if(typeof d.pts==='number') return d.pts;
  const r=scoreOf(d);return r?r.score:null;
}

/* ---------- rules: XP, levels, badges ---------- */
const XP_PLAN=5,XP_TASK=5,XP_CLOSE=20,XP_PT=10,XP_PHASE=25,XP_WEEK=100;
const STREAK_XP=[[3,30],[7,70],[14,150],[30,400],[60,800],[100,1500]];
const LEVELS=[
  ['Beginner','مبتدئ',0],['Explorer','مستكشف',150],['Learner','متعلّم',450],['Practitioner','ممارس',1000],
  ['Builder','بنّاء',1800],['Advanced','متقدم',3000],['Expert','خبير',4800],['Master','أسطى',7500]
];
function levelOf(xp){
  let i=0;for(let k=0;k<LEVELS.length;k++){if(xp>=LEVELS[k][2]) i=k;}
  const cur=LEVELS[i],next=LEVELS[i+1]||null;
  return {i:i,name:cur[0],ar:cur[1],from:cur[2],next:next,pct:next?(xp-cur[2])/(next[2]-cur[2])*100:100};
}
function daysOf(m){return (m&&m.days)||{};}
function hrs(day){const v=day?Number(day.hours):0;return v>0?v:0;}
function dayParts(d){
  const o={plan:0,tasks:0,close:0,ach:0,bonus:0};
  if(!d) return o;
  const tn=Math.max(Array.isArray(d.tasks)?d.tasks.length:0,d.tn||0);
  const td=typeof d.td==='number'?d.td:(Array.isArray(d.tasks)?d.tasks.filter(t=>t&&t.done).length:0);
  if(d.planned||tn>0) o.plan=XP_PLAN;
  o.tasks=Math.min(12,td)*XP_TASK;
  if(d.closed){
    o.close=XP_CLOSE;
    const p=dayPts(d)||0;o.ach=p*XP_PT;
    const t=TYPES.find(x=>x[0]===(d.ach&&d.ach.type));
    if(t&&p>0) o.bonus=t[3];
  }
  return o;
}
function dayXp(d){const o=dayParts(d);return o.plan+o.tasks+o.close+o.ach+o.bonus;}
function statsOf(m){
  m=m||{};
  const ds=daysOf(m),keys=Object.keys(ds).sort();
  const st={xp:0,closed:0,hours:0,best:0,cur:0,weeks:0,phases:0,mods:0,builds:0,fixes:0,ships:0,shared:0,li:0,bestPts:0,rmSteps:0,last:'',
    br:{plan:0,tasks:0,close:0,ach:0,bonus:0,phases:0,weeks:0,streak:0}};
  const wkHours={};let run=0,prev=null;
  keys.forEach(k=>{
    const d=ds[k];if(!d) return;
    const o=dayParts(d);
    st.br.plan+=o.plan;st.br.tasks+=o.tasks;st.br.close+=o.close;st.br.ach+=o.ach;st.br.bonus+=o.bonus;
    const hv=hrs(d);st.hours+=hv;const wk=weekStartOf(k);wkHours[wk]=(wkHours[wk]||0)+hv;
    if(d.closed){
      st.closed++;st.last=k;
      const p=dayPts(d)||0;if(p>st.bestPts) st.bestPts=p;
      const ty=d.ach&&d.ach.type;
      if(p>0){
        if(ty==='module') st.mods++;
        if(ty==='build') st.builds++;
        if(ty==='fix') st.fixes++;
        if(ty==='ship') st.ships++;
        if(d.ach&&d.ach.shared) st.shared++;
      }
      if(d.li) st.li++;
      if(prev&&addDays(prev,1)===k) run++; else run=1;
      prev=k;if(run>st.best) st.best=run;
    }
  });
  const tg=Number(m.weeklyTarget)||0;
  if(tg>0) for(const wk in wkHours){if(wkHours[wk]>=tg) st.weeks++;}
  const steps=(m.roadmap&&m.roadmap.steps)||[];
  st.rmSteps=steps.length;
  st.phases=Math.min(40,steps.filter(s=>Number(s.s)===2).length);
  let k=todayKey();if(!(ds[k]&&ds[k].closed)) k=addDays(k,-1);
  let c=0;while(ds[k]&&ds[k].closed&&c<4000){c++;k=addDays(k,-1);}
  st.cur=c;
  st.br.phases=st.phases*XP_PHASE;
  st.br.weeks=st.weeks*XP_WEEK;
  STREAK_XP.forEach(x=>{if(st.best>=x[0]) st.br.streak+=x[1];});
  st.xp=st.br.plan+st.br.tasks+st.br.close+st.br.ach+st.br.bonus+st.br.phases+st.br.weeks+st.br.streak;
  return st;
}

/* ---------- stats views ---------- */
function sumFrom(m,from){
  let s=0,n=0,pts=0,sc=0;const ds=daysOf(m);
  for(const k in ds){
    if(k>=from){
      const v=hrs(ds[k]);if(v>0){s+=v;n++;}
      const p=dayPts(ds[k]);if(p!=null){pts+=p;sc++;}
    }
  }
  return {hours:s,days:n,pts:pts,scored:sc};
}
function board(period){
  const from=period==='week'?weekStartKey():period==='month'?monthStartKey():'0000-00-00';
  const key=period==='xp'?'xp':'pts';
  return Object.keys(members).map(id=>{
    const m=members[id],s=sumFrom(m,from),st=statsOf(m);
    return {id:id,hours:s.hours,pts:s.pts,scored:s.scored,avg:s.scored?s.pts/s.scored:0,streak:st.cur,xp:st.xp,closed:st.closed,lv:levelOf(st.xp)};
  }).sort((a,b)=>b[key]-a[key]||(key==='xp'?b.closed-a.closed:b.avg-a.avg)||(a.id<b.id?-1:1));
}
function rankOf(b,row,key){return 1+b.filter(r=>r[key]>row[key]).length;}
function readOnly(){return !sb||!uid;}
function afterDays(patchDays){
  const ds=Object.assign({},daysOf(members[uid]));
  for(const k in patchDays) ds[k]=Object.assign({},ds[k],patchDays[k]);
  return Object.assign({},members[uid]||{},{days:ds});
}
function gainMsg(base,mAfter){
  const b=statsOf(members[uid]),a=statsOf(mAfter);
  let t=base;const dx=a.xp-b.xp;
  if(dx>0) t+=' · +'+dx+' XP';
  const lb=levelOf(b.xp).i,la=levelOf(a.xp).i;
  if(la>lb) t+=' · مستوى جديد: '+LEVELS[la][0];
  const nb=BADGES.filter(x=>x[3](a)&&!x[3](b));
  if(nb.length) t+=' · شارة جديدة: '+nb.map(x=>x[1]).join('، ');
  return t;
}

async function fetchAll(table,orderCols){
  let out=[],from=0;
  for(;;){
    let q=sb.from(table).select('*');
    orderCols.forEach(c=>{q=q.order(c);});
    const r=await q.range(from,from+999);
    if(r.error) throw r.error;
    const rows=r.data||[];
    out=out.concat(rows);
    if(rows.length<1000) break;
    from+=1000;
  }
  return out;
}

    dy.forEach(r=>{if(m[r.user_id]) m[r.user_id].days[r.day]=rowToDay(r);});

    const cc={};ct.forEach(r=>{cc[r.user_id]={wa:r.whatsapp};});

function handleErr(e){
  const m=String((e&&e.message)||''),c=e&&e.code;
  let t='مقدرتش أحفظ. جرّب تاني بعد شوية.';
  if(c==='23505'||/duplicate key/i.test(m)) t='الاسم ده مستخدم. اختار اسم تاني.';
  else if(/bad join code/i.test(m)) t='كود الانضمام غلط. اسأل صاحب الجروب.';
  else if(/day out of range/i.test(m)) t='اليوم ده برّه المدى المسموح (آخر 7 أيام).';
  else if(/linkedin step required/i.test(m)) t='لازم تعمل خطوة LinkedIn قبل قفل اليوم.';
  else if(c==='42501'||/row-level security/i.test(m)) t='مش مسموح لك بالعملية دي. سجّل خروج وادخل تاني.';
  else if(/jwt|expired/i.test(m)) t='الجلسة انتهت. سجّل دخول تاني.';
  else if(/failed to fetch|network/i.test(m)) t='مفيش اتصال بالسيرفر. اتأكد من النت.';
  toast(t,true);
}

function ensureR(){

  const r=(members[uid]||{}).roadmap||{};
  rdraft={role:r.role||'',title:r.title||'',steps:(r.steps||[]).map(s=>({t:String(s.t||''),s:Number(s.s)||0}))};

function addStep(){
  const t=newStepText.trim();if(!t) return;

  rdraft.steps.push({t:t.slice(0,120),s:0});newStepText='';rdirty=true;
  render().then(()=>{const e=$('#newStep');if(e)e.focus();});
}
async function saveRoadmap(){
  const rm={role:rdraft.role.trim().slice(0,80),title:rdraft.title.trim().slice(0,100),steps:rdraft.steps.map(s=>({t:s.t,s:s.s}))};
  const msg=gainMsg('اتحفظ الرود ماب',Object.assign({},members[uid]||{},{roadmap:rm}));
  try{
    const r=await sb.from('roadmaps').upsert({user_id:uid,role:rm.role,title:rm.title,steps:rm.steps},{onConflict:'user_id'});

/* ---------- auth ---------- */
function authErr(e){
  const m=String((e&&e.message)||'');
  if(/invalid login credentials/i.test(m)) return 'الإيميل أو الباسورد غلط';
  if(/already registered|already been registered/i.test(m)) return 'الإيميل ده مسجل قبل كده. اضغط دخول.';
  if(/email not confirmed/i.test(m)) return 'لازم تأكد الإيميل الأول من الرسالة اللي وصلتلك';
  if(/rate limit|too many|security purposes/i.test(m)) return 'محاولات كتير. استنى شوية وجرّب تاني';
  if(/password/i.test(m)) return 'الباسورد ضعيف. استخدم 8 حروف على الأقل';
  if(/failed to fetch|network/i.test(m)) return 'مفيش اتصال بالسيرفر. اتأكد من النت';
  return 'حصلت مشكلة. جرّب تاني.';
}
async function doAuth(){
  const email=authEmail.trim(),pw=($('#apass')||{}).value||'';
  if(!/^\S+@\S+\.\S+$/.test(email)){authMsg=['اكتب إيميل صح',true];render();return;}
  if(pw.length<8){authMsg=['الباسورد لازم يكون 8 حروف على الأقل',true];render();return;}
  authBusy=true;authMsg=null;render();
  try{
    if(authMode==='signup'){
      const r=await sb.auth.signUp({email:email,password:pw});
      if(r.error) throw r.error;
      if(!r.data.session) authMsg=['اتبعتلك إيميل تأكيد. افتحه واضغط على اللينك، وبعدين ارجع ادخل.',false];
    }else{
      const r=await sb.auth.signInWithPassword({email:email,password:pw});
      if(r.error) throw r.error;
    }
  }catch(e){authMsg=[authErr(e),true];}
  authBusy=false;render();
}
async function doGoogle(){
  try{
    const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
    if(r.error) throw r.error;
  }catch(e){authMsg=['دخول Google مش متفعّل لسه',true];render();}
}
async function doReset(){
  const email=authEmail.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){authMsg=['اكتب إيميلك الأول في الخانة',true];render();return;}
  try{
    const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(r.error) throw r.error;
    authMsg=['لو الإيميل مسجل، هيوصلك لينك تغيير الباسورد.',false];
  }catch(e){authMsg=[authErr(e),true];}
  render();
}
async function doNewPass(){
  const pw=($('#npass')||{}).value||'';
  if(pw.length<8){authMsg=['الباسورد لازم يكون 8 حروف على الأقل',true];render();return;}
  try{
    const r=await sb.auth.updateUser({password:pw});
    if(r.error) throw r.error;
    authMode='login';authMsg=null;toast('اتغيّر الباسورد');
  }catch(e){authMsg=[authErr(e),true];}
  render();
}
async function doSignOut(){
  try{await sb.auth.signOut();}catch(e){}
}
function viewAuth(){
  const signup=authMode==='signup';
  const f=h('form',{class:'fm',onsubmit:e=>{e.preventDefault();doAuth();}},
    h('label',{class:'lbl',for:'aemail',text:'الإيميل'}),
    h('input',{id:'aemail',type:'email',dir:'ltr',autocomplete:'email',value:authEmail,oninput:e=>{authEmail=e.target.value;}}),
    h('label',{class:'lbl',for:'apass',text:'الباسورد (8 حروف على الأقل)'}),
    h('input',{id:'apass',type:'password',dir:'ltr',autocomplete:signup?'new-password':'current-password'}),
    h('div',{class:'row'},h('button',{class:'btn primary',type:'submit',disabled:authBusy,text:authBusy?'استنى...':(signup?'سجّل حساب':'دخول')})));
  const kids=[
    h('h2',{id:'au-h',text:signup?'حساب جديد':'ادخل الدفتر'}),
    h('p',{class:'muted flat',text:signup?'سجّل بإيميلك وباسورد، وبعدها هتكمّل بياناتك وتدخل الجروب بالكود.':'ادخل بإيميلك وباسورد علشان تسجل يومك وتشوف الجروب.'}),
    authMsg?h('p',{class:'note'+(authMsg[1]?' bad':''),role:'status',text:authMsg[0]}):null,
    f];
  if(cfg.GOOGLE_LOGIN) kids.push(h('div',{class:'row'},h('button',{class:'btn',type:'button',onclick:doGoogle,text:'ادخل بحساب Google'})));
  kids.push(h('div',{class:'row'},
    h('button',{class:'btn ghost sm',type:'button',onclick:()=>{authMode=signup?'login':'signup';authMsg=null;render();},text:signup?'عندي حساب. دخول':'معنديش حساب. سجّل حساب جديد'}),
    signup?null:h('button',{class:'btn ghost sm',type:'button',onclick:doReset,text:'نسيت الباسورد'})));
  return h('div',{class:'stack'},h('section',{class:'card auth','aria-labelledby':'au-h'},kids));
}
function viewRecovery(){
  return h('div',{class:'stack'},h('section',{class:'card auth','aria-labelledby':'rc-h'},
    h('h2',{id:'rc-h',text:'اكتب باسورد جديد'}),
    authMsg?h('p',{class:'note'+(authMsg[1]?' bad':''),role:'status',text:authMsg[0]}):null,
    h('form',{class:'fm',onsubmit:e=>{e.preventDefault();doNewPass();}},
      h('label',{class:'lbl',for:'npass',text:'الباسورد الجديد (8 حروف على الأقل)'}),
      h('input',{id:'npass',type:'password',dir:'ltr',autocomplete:'new-password'}),
      h('div',{class:'row'},h('button',{class:'btn primary',type:'submit',text:'غيّر الباسورد'})))));
}
function viewSetup(){
  return h('div',{class:'stack'},h('section',{class:'card'},
    h('h2',{text:'الموقع لسه محتاج إعداد'}),
    h('p',{class:'flat',text:'افتح ملف config.js وحط رابط مشروع Supabase والمفتاح العام (anon key). الخطوات كاملة في ملف SETUP.md.'})));
}

/* ---------- render ---------- */
function tabList(){
  const t=[['today','اليوم'],['group','أعضاء الجروب'],['ranking','الترتيب'],['roadmap','الرود ماب'],['profile','بروفايلي']];
  if(isAdmin) t.push(['admin','الأدمن']);
  return t;
}
function renderTabs(){
  const nav=$('#tabs'),act=$('#hdr-actions');
  const inApp=!!(sb&&uid&&loaded&&members[uid]);
  const cur=route==='member'?'group':route;
  nav.replaceChildren(...(inApp?tabList().map(t=>{
    const a=h('a',{href:'#'+t[0],'data-r':t[0],text:t[1]});
    if(t[0]===cur) a.setAttribute('aria-current','page');
    return a;
  }):[]));
  act.replaceChildren(...(sb&&uid?[h('button',{class:'btn ghost sm',type:'button',onclick:doSignOut,text:'خروج'})]:[]));
}
function render(){
  let node;
  if(!ready) node=h('p',{class:'empty',text:'بحمّل...'});
  else if(!sb) node=viewSetup();
  else if(authMode==='recovery'&&uid) node=viewRecovery();
  else if(!uid) node=viewAuth();
  else if(!loaded) node=h('p',{class:'empty',text:'بحمّل البيانات...'});
  else if(needsProfile()) node=viewOnboard();
  else if(route==='group') node=viewGroup();
  else if(route==='ranking') node=viewRanking();
  else if(route==='roadmap') node=viewRoadmap();
  else if(route==='profile') node=viewProfile(uid);
  else if(route==='member') node=viewProfile(viewMember||uid);
  else if(route==='admin'&&isAdmin) node=viewAdmin();
  else node=viewToday();
  $('#view').replaceChildren(node);
  $('#today-label').textContent=longDate(todayKey());
  renderTabs();
  return Promise.resolve();
}
function typingInView(){
  const a=document.activeElement;
  return !!(a&&$('#view').contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'));
}
function softRender(){if(typingInView()){pending=true;return;}render();}
document.addEventListener('focusout',()=>{
  if(!pending) return;
  setTimeout(()=>{if(pending&&!typingInView()){pending=false;render();}},60);
});
function setRoute(){
  const r=(location.hash||'').replace('#','');
  route=(r==='member'||tabList().some(t=>t[0]===r))?r:'today';
  render();
}

/* ---------- init ---------- */
async function startSession(){
  if(started===uid) return;
  started=uid;loaded=false;render();
  try{const r=await sb.rpc('is_admin');isAdmin=r.data===true;}catch(e){isAdmin=false;}
  await loadAll();
  subscribeLive();
}
function endSession(){
  started=null;members={};contacts={};emails={};isAdmin=false;loaded=false;draft=null;rdraft=null;ob=null;authMode='login';authMsg=null;
  location.hash='';render();
}
async function init(){
  window.addEventListener('hashchange',setRoute);
  if(!window.supabase||!cfg.SUPABASE_URL||/YOUR-PROJECT/.test(cfg.SUPABASE_URL)||!cfg.SUPABASE_ANON_KEY){ready=true;render();return;}
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,sess)=>{
    if(ev==='PASSWORD_RECOVERY') authMode='recovery';
    const prev=uid;session=sess;uid=sess&&sess.user?sess.user.id:null;
    setTimeout(()=>{
      if(uid&&uid!==prev) startSession();
      else if(!uid&&prev) endSession();
      else render();
    },0);
  });
  try{const r=await sb.auth.getSession();session=r.data.session;uid=session&&session.user?session.user.id:null;}catch(e){}
  ready=true;
  setRoute();
  if(uid) startSession();
}
init();

})();
